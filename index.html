<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FDA Combined Calculator</title>
<style>

    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 999px;
      --color-bg: #f7f6f2; --color-surface: #fbfbf9; --color-surface-2: #f3f0ec; --color-border: #d4d1ca;
      --color-text: #28251d; --color-text-muted: #6f6d67; --color-primary: #01696f; --color-primary-hover: #0c4e54;
      --color-primary-soft: #d9eceb; --color-warning: #964219; --shadow-md: 0 12px 32px rgba(25,27,28,.12);
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #22211f; --color-border: #393836;
      --color-text: #ece8df; --color-text-muted: #a9a399; --color-primary: #4f98a3; --color-primary-hover: #68b4bf;
      --color-primary-soft: #203538; --color-warning: #d18a63; --shadow-md: 0 12px 32px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      background: radial-gradient(circle at top, rgba(1,105,111,.08), transparent 28%), var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .app {
      max-width: 920px;
      margin: 0 auto;
      padding: max(env(safe-area-inset-top), var(--space-6)) var(--space-4) max(env(safe-area-inset-bottom), var(--space-6));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .title {
      font-size: var(--text-xl);
      line-height: 1.1;
      margin: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      max-width: 58ch;
    }

    .theme-toggle {
      min-width: 48px;
      min-height: 48px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 700;
    }

    .card {
      background: color-mix(in srgb, var(--color-surface) 92%, white 8%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
    }

    .grid { display: grid; gap: var(--space-4); }
    .grid.two { grid-template-columns: 1fr; }

    @media (min-width: 700px) {
      .grid.two { grid-template-columns: repeat(2, 1fr); }
    }

    label {
      display: grid;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 0 var(--space-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--text-lg);
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--color-primary) 45%, transparent);
      outline-offset: 2px;
    }

    .stack { display: grid; gap: var(--space-3); }

    .group {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }

    .row-head {
      display: flex;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-bottom: var(--space-2);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 var(--space-3);
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: var(--text-xs);
      font-weight: 700;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
      margin-top: var(--space-5);
    }

    .btn {
      min-height: 52px;
      border: 0;
      border-radius: var(--radius-lg);
      font-weight: 700;
    }

    .btn-secondary {
      background: var(--color-surface-2);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .results {
      display: grid;
      gap: var(--space-3);
    }

    .stat {
      background: var(--color-surface-2);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
    }

    .stat-label {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-1);
    }

    .stat-value {
      font-size: clamp(1.5rem, 1.2rem + 2vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .mono {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .small { font-size: var(--text-xs); }
    .muted { color: var(--color-text-muted); }
    .error { color: var(--color-warning); font-size: var(--text-sm); min-height: 1.5em; margin-top: var(--space-3); }
    .formula { font-size: var(--text-sm); color: var(--color-text-muted); }
  
.tabs { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); margin-bottom:var(--space-5); }
.tab-btn { min-height:48px; border-radius:var(--radius-lg); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text); font-weight:700; cursor:pointer; }
.tab-btn.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
.tab-panel { display:none; }
.tab-panel.active { display:block; animation:fadeIn 120ms ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.result-main { font-weight:800; font-size:var(--text-lg); }
.result-sub { display:block; font-size:var(--text-sm); color:var(--color-text-muted); margin-top:4px; }
.avg-line { margin-top:var(--space-3); }

.compact-mobile .app { max-width: 1100px; padding: max(env(safe-area-inset-top), var(--space-4)) var(--space-3) max(env(safe-area-inset-bottom), var(--space-4)); }
.compact-mobile .tabs { gap: var(--space-2); margin-bottom: var(--space-4); }
.compact-mobile .card { padding: var(--space-4); margin-bottom: var(--space-3); }
.compact-mobile .topbar { margin-bottom: var(--space-4); }
.compact-mobile .result-main { font-size: var(--text-lg); }
.compact-mobile .result-sub { display:block; font-size: var(--text-sm); color: var(--color-text-muted); margin-top: 4px; }
.compact-mobile .stat .label { display:block; font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: 4px; }
@media (max-width: 699px) {
  .compact-mobile .app { padding-left: 10px; padding-right: 10px; }
  .compact-mobile h1 { font-size: 1.5rem; margin: 0; }
  .compact-mobile .topbar { gap: var(--space-2); }
  .compact-mobile .topbar-left { gap: 4px; }
  .compact-mobile .eyebrow { margin: 0; }
  .compact-mobile .tabs { position: sticky; top: 0; z-index: 10; background: var(--color-bg); padding-bottom: 4px; }
  .compact-mobile .grid.two { gap: 8px; }
  .compact-mobile .grid.two label { font-size: 12px; }
  .compact-mobile input { min-height: 42px; padding: 0 10px; font-size: 16px; }
  .compact-mobile .results { gap: 8px; }
  .compact-mobile .card { padding: 12px; }
  .compact-mobile .result-main { font-size: 1.1rem; }
  .compact-mobile .result-sub { font-size: 0.78rem; }
}

</style>
</head>
